<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var m=location.pathname.match(/^(.*?\/fsfinds-site\/)/);var b=m?m[1]:'/';window.FS_BASE=b;document.write('<base href="'+b+'">');})();</script>
<script src="support.js"></script>
</head>
<body>
<x-dc>
<div onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onClick="{{ item.open }}" style="cursor:pointer;position:relative;display:flex;flex-direction:column;background:#151518;border:1px solid {{ borderC }};border-radius:18px;overflow:hidden;transform:{{ lift }};box-shadow:{{ shadow }};transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;min-width:0;height:100%">
  <div style="position:relative;aspect-ratio:1;overflow:hidden;background:#1C1C20;margin:6px;border-radius:13px">
    <div style="position:absolute;inset:0;background:{{ imgBg }};background-size:cover;background-position:center;transform:{{ imgScale }};transition:transform .7s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-end;justify-content:center;padding:12px">
      <span style="font-family:'DM Sans',sans-serif;font-size:11px;color:#6E6D73">{{ imgLabel }}</span>
    </div>
    <span style="position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#F5F4F2;background:rgba(11,11,13,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 9px;border-radius:999px"><span style="width:6px;height:6px;border-radius:50%;background:#3DDC84"></span>{{ item.qc }} QC</span>
    <button onClick="{{ item.toggleFav }}" title="Save" style="position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:none;background:{{ item.favBg }};color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.3,1.7,.5,1),background .2s" style-hover="transform:scale(1.12)" style-active="transform:scale(.7)">{{ item.favIcon }}</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;padding:8px 14px 14px;flex:1">
    <span style="font-size:12px;color:#A1A0A6">{{ item.sellerName }}</span>
    <span style="font-family:'Sora',sans-serif;font-size:14px;font-weight:600;line-height:1.35;color:#F5F4F2;text-wrap:pretty;flex:1">{{ item.name }}</span>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
      <span style="font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:#F5F4F2">{{ item.priceLabel }}</span>
      <span style="width:32px;height:32px;border-radius:50%;background:{{ goBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;transform:{{ goRot }};transition:background .3s,transform .35s cubic-bezier(.2,.8,.2,1)">→</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:360},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state={h:false};
  renderVals(){
    const h=this.state.h,it=this.props.item||{},img=it.image;
    return{enter:()=>this.setState({h:true}),leave:()=>this.setState({h:false}),
      borderC:h?'rgba(229,32,47,.55)':'#232327',lift:h?'translateY(-6px)':'none',shadow:h?'0 24px 48px -24px rgba(229,32,47,.45)':'0 0 0 rgba(0,0,0,0)',
      imgScale:h?'scale(1.07)':'scale(1)',goBg:h?'#E5202F':'#26262B',goRot:h?'rotate(-45deg)':'none',
      imgBg:img?`url("${img}")`:'radial-gradient(circle at 50% 45%,#26262B,#1C1C20 70%)',imgLabel:img?'':'product photo'};
  }
}
</script>
</body>
</html>
